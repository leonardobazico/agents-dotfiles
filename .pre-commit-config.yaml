default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter==2.1.2
          - mdformat-gfm==1.0.0
        files: \.md$
        exclude: (^|/)templates/.*\.md$

  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
        files: ^Makefile$

  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: unittest
        name: python unittest suite
        entry: shared/skills/count-tokens/scripts/run_tests.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: shell-tests
        name: shell test suite
        entry: scripts/run_tests.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --no-banner
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
