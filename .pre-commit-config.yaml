default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # First, so its coaching appears before the raw linter output below.
  - repo: local
    hooks:
      - id: habit-hooks
        name: habit-hooks (uncommitted work)
        entry: habit-hooks --since HEAD
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys, --no-ensure-ascii]
        # habit-snooze rewrites its index on every snooze; formatting it would churn.
        exclude: ^\.habit-hooks/snooze\.json$
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter==2.1.2
          - mdformat-gfm==1.0.0
        files: \.md$
        exclude: (^|/)templates/.*\.md$

  # shfmt takes its indentation from .editorconfig.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt

  - repo: https://github.com/checkmake/checkmake.git
    rev: v0.3.2
    hooks:
      - id: checkmake
        files: ^Makefile$

  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.9
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      - id: unittest
        name: python unittest suite
        entry: shared/skills/count-tokens/scripts/run_tests.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: script-tests
        name: repository script tests
        entry: scripts/run_tests.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks-staged
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --no-banner
        language: system
        pass_filenames: false
        always_run: true

      - id: gitleaks-history
        name: gitleaks (full history)
        entry: gitleaks git --no-banner
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # Last, so it judges what the formatters above left behind.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
